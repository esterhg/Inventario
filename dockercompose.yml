# Solo para pruebas locales. En Coolify normalmente NO usarás este archivo:
# ahí defines la app y la base de datos como dos recursos separados y
# configuras las variables de entorno desde su panel.
version: "3.8"

services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: control_activos_occ
      DB_USER: postgres
      DB_PASSWORD: Insta2025
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control_activos_occ
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Insta2025
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  uploads_data:
  db_data:
